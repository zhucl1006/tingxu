<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>听序 Tingxu · 极简无感 AI 会议助手 UI/UX 全功能设计稿 v0.3 (Impeccable Edition)</title>
  <style>
    /* ==========================================================================
       听序 (Tingxu) — Impeccable Design System v0.3 全功能交互规范
       Operate Mode / Precision Desktop Productivity
       ========================================================================== */
    :root {
      /* 基础色彩 */
      --bg-canvas: #ffffff;
      --bg-subtle: #f8f9fb;
      --bg-panel: #f0f3f7;
      --bg-active: #edf3ff;
      --bg-card: #ffffff;
      
      /* 文本与边线 */
      --text-primary: #1e2530;
      --text-secondary: #586376;
      --text-tertiary: #8a94a6;
      --border-subtle: #e2e6ed;
      --border-strong: #c8d0dc;
      
      /* 核心品牌蓝 */
      --brand-blue: #1d58bd;
      --brand-blue-hover: #15459b;
      --brand-blue-subtle: #ebf2fe;
      --brand-blue-border: #b8d0f8;

      /* 语义状态色彩 */
      --status-success: #1b7a4a;
      --status-success-bg: #eaf6ef;
      --status-success-border: #9fd4b7;
      
      --status-warning: #945318;
      --status-warning-bg: #fdf5ea;
      --status-warning-border: #dfb88e;
      
      --status-danger: #bd3124;
      --status-danger-bg: #fdeeee;
      --status-danger-border: #f2adad;

      /* 阴影 */
      --shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.04);
      --shadow-md: 0 4px 16px -2px rgba(16, 24, 40, 0.08), 0 2px 6px -1px rgba(16, 24, 40, 0.04);
      --shadow-lg: 0 12px 32px -4px rgba(16, 24, 40, 0.12), 0 4px 12px -2px rgba(16, 24, 40, 0.06);

      /* 圆角 */
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --radius-full: 9999px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-canvas: #13171f;
        --bg-subtle: #1a202a;
        --bg-panel: #222a36;
        --bg-active: #1e2c42;
        --bg-card: #191f29;
        
        --text-primary: #f2f5f9;
        --text-secondary: #9da8b9;
        --text-tertiary: #6b7788;
        --border-subtle: #2d3746;
        --border-strong: #455266;
        
        --brand-blue: #7aa5f8;
        --brand-blue-hover: #9bbcf9;
        --brand-blue-subtle: #1e2e47;
        --brand-blue-border: #355078;
        
        --status-success: #70cb95;
        --status-success-bg: #182e21;
        --status-success-border: #284f37;
        
        --status-warning: #f0be88;
        --status-warning-bg: #352818;
        --status-warning-border: #5e4629;
        
        --status-danger: #f8968c;
        --status-danger-bg: #361a19;
        --status-danger-border: #632e2c;

        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.2);
        --shadow-md: 0 4px 16px -2px rgba(0, 0, 0, 0.4);
        --shadow-lg: 0 12px 32px -4px rgba(0, 0, 0, 0.6);
      }
    }

    /* 基础重置 */
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg-canvas);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    h1, h2, h3, p { margin: 0; }
    a { color: var(--brand-blue); text-decoration: none; cursor: pointer; }
    a:hover { text-decoration: underline; }

    /* 通用控件 */
    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 7px 12px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
      transition: background 150ms ease, border-color 150ms ease, color 150ms ease;
      white-space: nowrap;
    }
    button:hover {
      background: var(--bg-subtle);
      border-color: var(--border-strong);
    }
    button:active { transform: translateY(1px); }
    button.primary {
      background: var(--brand-blue);
      border-color: var(--brand-blue);
      color: #ffffff;
    }
    button.primary:hover {
      background: var(--brand-blue-hover);
      border-color: var(--brand-blue-hover);
    }
    button.link {
      background: transparent;
      border-color: transparent;
      color: var(--brand-blue);
      padding: 0;
    }
    button.link:hover {
      text-decoration: underline;
      background: transparent;
      border-color: transparent;
    }
    button.danger {
      color: var(--status-danger);
    }
    button.danger:hover {
      background: var(--status-danger-bg);
      border-color: var(--status-danger-border);
    }

    input, select, textarea {
      width: 100%;
      background: var(--bg-canvas);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      padding: 8px 12px;
      font-size: 14px;
      color: var(--text-primary);
      transition: border-color 150ms ease, box-shadow 150ms ease;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--brand-blue);
      box-shadow: 0 0 0 3px var(--brand-blue-subtle);
    }
    label {
      display: block;
      margin: 10px 0 4px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    /* 徽章与标签 */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 500;
      padding: 2px 8px;
      border-radius: var(--radius-sm);
      line-height: 1.4;
      white-space: nowrap;
    }
    .badge.blue {
      background: var(--brand-blue-subtle);
      color: var(--brand-blue);
      border: 1px solid var(--brand-blue-border);
    }
    .badge.green {
      background: var(--status-success-bg);
      color: var(--status-success);
      border: 1px solid var(--status-success-border);
    }
    .badge.warn {
      background: var(--status-warning-bg);
      color: var(--status-warning);
      border: 1px solid var(--status-warning-border);
    }
    .badge.danger {
      background: var(--status-danger-bg);
      color: var(--status-danger);
      border: 1px solid var(--status-danger-border);
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }
    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--status-danger);
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(189, 49, 36, 0.4); }
      70% { box-shadow: 0 0 0 6px rgba(189, 49, 36, 0); }
      100% { box-shadow: 0 0 0 0 rgba(189, 49, 36, 0); }
    }

    /* 顶部提示横条 */
    .top-banner {
      padding: 7px 20px;
      background: var(--brand-blue-subtle);
      border-bottom: 1px solid var(--brand-blue-border);
      color: var(--brand-blue);
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    /* 页面布局 */
    .app-shell {
      display: grid;
      grid-template-columns: 220px 1fr;
      min-height: calc(100vh - 35px);
    }
    aside {
      background: var(--bg-subtle);
      border-right: 1px solid var(--border-subtle);
      padding: 20px 14px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .brand-box {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 8px;
    }
    .brand-logo {
      width: 32px;
      height: 32px;
      background: var(--brand-blue);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .brand-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .brand-sub {
      font-size: 11px;
      color: var(--text-tertiary);
      letter-spacing: 1px;
    }

    /* 导航栏 */
    nav { display: grid; gap: 4px; }
    nav button {
      width: 100%;
      text-align: left;
      background: transparent;
      border-color: transparent;
      color: var(--text-secondary);
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 500;
      justify-content: flex-start;
      border-radius: var(--radius-sm);
    }
    nav button:hover {
      background: var(--bg-panel);
      color: var(--text-primary);
    }
    nav button.active {
      background: var(--bg-active);
      color: var(--brand-blue);
      font-weight: 600;
    }
    .nav-icon { width: 18px; text-align: center; }

    /* 侧栏底部额度与用户信息 */
    .sidebar-bottom { margin-top: auto; display: grid; gap: 14px; }
    .quota-box {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 12px;
    }
    .meter-bar {
      height: 4px;
      background: var(--border-subtle);
      border-radius: var(--radius-full);
      margin: 8px 0;
      overflow: hidden;
    }
    .meter-fill {
      height: 100%;
      width: 48%;
      background: var(--brand-blue);
      border-radius: var(--radius-full);
    }
    .user-profile {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 8px 0;
      border-top: 1px solid var(--border-subtle);
    }
    .user-avatar {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      background: var(--brand-blue-subtle);
      color: var(--brand-blue);
      display: grid;
      place-items: center;
      font-weight: 600;
    }

    /* 顶栏 Header */
    header {
      height: 52px;
      padding: 0 28px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-canvas);
    }
    .breadcrumb { font-size: 13px; color: var(--text-secondary); }

    /* 内容区 */
    main { min-width: 0; background: var(--bg-canvas); }
    .container { max-width: 1400px; margin: 0 auto; padding: 24px 28px; }

    /* 卡片与网格 */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
      margin: 16px 0;
    }
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 20px;
      box-shadow: var(--shadow-sm);
    }
    .card.soft { background: var(--bg-subtle); }
    .stat-number {
      font-size: 26px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      margin: 6px 0 2px;
      color: var(--text-primary);
    }

    /* ==========================================================================
       会中双栏工作台 (C-04 Live Dual-Pane Workbench)
       ========================================================================== */
    .live-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .live-header-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .live-header h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .live-timer {
      font-size: 20px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .live-workbench {
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      gap: 18px;
      height: clamp(520px, calc(100vh - 230px), 820px);
    }
    .pane {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }
    .pane-header {
      padding: 12px 18px;
      border-bottom: 1px solid var(--border-subtle);
      background: var(--bg-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .segmented-tabs {
      display: flex;
      background: var(--bg-panel);
      padding: 3px;
      border-radius: var(--radius-sm);
      gap: 2px;
    }
    .segmented-tabs button {
      background: transparent;
      border: 0;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      border-radius: var(--radius-sm);
    }
    .segmented-tabs button.active {
      background: var(--bg-card);
      color: var(--text-primary);
      box-shadow: var(--shadow-sm);
      font-weight: 600;
    }

    .pane-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 16px 18px;
      scrollbar-gutter: stable;
    }
    .pane-footer {
      padding: 10px 18px;
      background: var(--bg-subtle);
      border-top: 1px solid var(--border-subtle);
      font-size: 12px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* 议题条幅 */
    .topic-banner {
      background: var(--bg-panel);
      border-radius: var(--radius-sm);
      padding: 8px 12px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
    }

    /* 洞察卡片 (Insight Card) */
    .insight-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-left: 3px solid var(--brand-blue);
      border-radius: var(--radius-sm);
      padding: 14px;
      margin-bottom: 12px;
      transition: border-color 150ms ease, box-shadow 150ms ease;
    }
    .insight-card:hover {
      box-shadow: var(--shadow-sm);
    }
    .insight-card.protected {
      border-left-color: var(--status-success);
    }
    .insight-card.suggestion {
      border-left-color: var(--status-warning);
    }
    .insight-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }
    .insight-card-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      margin: 4px 0;
    }
    .insight-card-body {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.5;
    }
    .evidence-anchor {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: var(--brand-blue);
      margin-top: 8px;
      cursor: pointer;
      font-weight: 500;
      background: transparent;
      border: 0;
      padding: 0;
    }
    .evidence-anchor:hover { text-decoration: underline; }

    .card-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px dashed var(--border-subtle);
    }
    .card-actions button {
      padding: 3px 8px;
      font-size: 12px;
      border-color: transparent;
      background: var(--bg-subtle);
    }
    .card-actions button:hover {
      background: var(--bg-panel);
      border-color: var(--border-strong);
    }

    /* 修订待复核对比区块 (Human Protection Proposal) */
    .proposal-box {
      margin-top: 10px;
      padding: 10px 12px;
      background: var(--status-warning-bg);
      border: 1px solid var(--status-warning-border);
      border-radius: var(--radius-sm);
      font-size: 12px;
      color: var(--status-warning);
    }
    .proposal-diff {
      margin: 6px 0 10px;
      line-height: 1.5;
      color: var(--text-primary);
    }

    /* 逐字稿行 */
    .transcript-row {
      padding: 12px 10px;
      border-bottom: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      transition: background 200ms ease;
    }
    .transcript-row:hover {
      background: var(--bg-subtle);
    }
    .transcript-row.highlighted {
      background: var(--bg-active);
      box-shadow: 0 0 0 2px var(--brand-blue-border);
    }
    .transcript-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-tertiary);
      margin-bottom: 4px;
    }
    .transcript-speaker {
      font-weight: 600;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .transcript-time {
      font-variant-numeric: tabular-nums;
      font-size: 12px;
      color: var(--brand-blue);
    }
    .transcript-text {
      font-size: 13.5px;
      line-height: 1.6;
      color: var(--text-primary);
    }

    /* 底部录音控制器 (Sticky Footer Controller) */
    .live-controller {
      margin-top: 16px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow-sm);
      flex-wrap: wrap;
      gap: 12px;
    }
    .control-btn-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* 微型悬浮小条 (C-05 Floating Pill) */
    .floating-pill {
      position: fixed;
      bottom: 24px;
      right: 28px;
      z-index: 50;
      background: var(--bg-card);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-full);
      padding: 6px 14px;
      box-shadow: var(--shadow-lg);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .floating-pill .time-display {
      font-size: 14px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    /* 问答聊天框 */
    .chat-bubble-q {
      background: var(--bg-active);
      padding: 10px 14px;
      border-radius: var(--radius-md);
      margin: 10px 0 10px 24px;
      font-size: 13px;
      border: 1px solid var(--brand-blue-border);
    }
    .chat-bubble-a {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border-subtle);
      font-size: 13px;
      line-height: 1.6;
    }

    /* 表格组件 */
    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      text-align: left;
    }
    .data-table th {
      padding: 10px 14px;
      font-weight: 600;
      color: var(--text-secondary);
      background: var(--bg-subtle);
      border-bottom: 1px solid var(--border-subtle);
    }
    .data-table td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border-subtle);
      color: var(--text-primary);
    }
    .data-table tr:hover td {
      background: var(--bg-subtle);
    }

    /* 待办事项列表 */
    .task-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 12px;
      border-bottom: 1px solid var(--border-subtle);
    }
    .task-item.completed label {
      text-decoration: line-through;
      color: var(--text-tertiary);
    }
    .task-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      margin-top: 3px;
      cursor: pointer;
    }

    /* 弹窗 Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(4px);
      z-index: 99;
      display: grid;
      place-items: center;
      padding: 20px;
    }
    .modal-box {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      width: min(540px, 100%);
      padding: 24px;
      box-shadow: var(--shadow-lg);
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .modal-header h2 { font-size: 18px; font-weight: 600; }
    .modal-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    /* 响应式适配 */
    @media (max-width: 900px) {
      .app-shell { grid-template-columns: 1fr; }
      aside { display: none; }
      .live-workbench { grid-template-columns: 1fr; height: auto; }
    }
  </style>
</head>
<body>

  <!-- 顶部演示指引栏 -->
  <div class="top-banner" data-testid="global-header-div-banner">
    <span>🎙️ 听序 Tingxu · UI/UX 生产级全功能设计稿 v0.3 (Impeccable Edition) · 会议数据仅存本机</span>
    <div style="display: flex; gap: 8px;">
      <button class="small" data-testid="global-header-btn-test-scenarios" onclick="openScenarios()">⚡️ 测试异常状态</button>
      <button class="small" id="switch-admin-btn" data-testid="global-header-btn-switch-admin" onclick="switchMode()">进入运营后台 ↗</button>
    </div>
  </div>

  <div class="app-shell" data-testid="app-shell-container">
    
    <!-- 侧边栏导航 -->
    <aside data-testid="app-sidebar-container">
      <div class="brand-box" data-testid="app-sidebar-div-brand">
        <div class="brand-logo" data-testid="app-sidebar-div-logo">

            <h2 style="font-size:16px; margin-bottom:12px;">会中洞察快照与修订记录</h2>
            <div style="font-size:13px; color:var(--text-secondary); margin-bottom:14px;">
              已永久保存会中达成的 2 项明确决定与 1 项经修订的采集验证待办。
            </div>
            ${liveItems.map(item => `
              <div class="insight-card protected">
                <strong>${esc(item.title)}</strong>
                <p style="font-size:13px; margin-top:4px;">${esc(item.body)}</p>
              </div>
            `).join('')}
          </div>
        `}
      `;
    }

    // =========================================================================
    // 视图 8：运营控制台 (Admin Overview & Audit)
    // =========================================================================
    function renderAdminOverview() {
      return `
        <div style="margin-bottom:20px;">
          <h1 style="font-size:24px; font-weight:700;">听序 · 独立 Web 运营控制台</h1>
          <p style="color:var(--text-secondary); margin-top:4px;">仅供所有者与授权运营人员使用。严守 Zero-Content 隐私铁律：后台完全看不到用户会议正文。</p>
        </div>

        <div class="cards-grid">
          <div class="card">
            <span style="font-size:12px; color:var(--text-tertiary);">独立用户总数</span>
            <div class="stat-number">1,286 人</div>
            <span style="font-size:12px; color:var(--status-success);">按脱敏账号去重</span>
          </div>

          <div class="card">
            <span style="font-size:12px; color:var(--text-tertiary);">本月转写处理时长</span>
            <div class="stat-number">18,420 分钟</div>
            <span style="font-size:12px; color:var(--text-secondary);">来自已结算流水</span>
          </div>

          <div class="card">
            <span style="font-size:12px; color:var(--text-tertiary);">本月实收账款</span>
            <div class="stat-number">¥8,640.00</div>
            <span style="font-size:12px; color:var(--brand-blue);">微信商户号入账</span>
          </div>
        </div>

        <div class="card" style="margin-top:24px;">
          <h2 style="font-size:16px; margin-bottom:12px;">运营补偿与审批流水 (不可篡改账本)</h2>
          <table class="data-table">
            <thead>
              <tr>
                <th>流水 ID</th>
                <th>操作人</th>
                <th>调整类型</th>
                <th>调整数量</th>
                <th>业务理由</th>
                <th>审批状态</th>
              </tr>
            </thead>
            <tbody>
              ${db.ledger.map(l => `
                <tr>
                  <td>#${l.id}</td>
                  <td>${esc(l.actor)}</td>
                  <td>${esc(l.type)}</td>
                  <td>+${l.amount} 分钟</td>
                  <td>${esc(l.reason)}</td>
                  <td><span class="badge green">${esc(l.status)}</span></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    // =========================================================================
    // 弹窗与微交互函数
    // =========================================================================
    function openPaymentModal(name, price) {
      $('#modal-slot').innerHTML = `
        <div class="modal-overlay">
          <div class="modal-box">
            <div class="modal-header">
              <h2>微信扫码支付 (模拟收银台)</h2>
              <button class="link" onclick="closeModal()">✕</button>
            </div>
            <div style="font-size:14px; margin-bottom:16px;">
              选购商品：<strong>${esc(name)}</strong> · 实付金额：<strong style="font-size:18px; color:var(--brand-blue);">¥${price}.00</strong>
            </div>
            <div style="background:var(--bg-subtle); border:1px dashed var(--border-strong); border-radius:var(--radius-md); padding:30px; text-align:center;">
              <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 7h3v3H7zM14 7h3v3h-3zM7 14h3v3H7zM14 14h3v3h-3z"/></svg>
              <div style="font-size:13px; font-weight:600; margin-top:10px;">微信 Native 扫码支付占位区</div>
              <div style="font-size:11px; color:var(--text-tertiary);">正式版由服务端验签回调，不可重复入账</div>
            </div>
            <div class="modal-footer">
              <button onclick="closeModal()">取消</button>
              <button class="primary" onclick="simulatePaySuccess('${name}', ${price})">模拟扫码支付成功</button>
            </div>
          </div>
        </div>
      `;
    }

    function simulatePaySuccess(name, price) {
      db.orders.unshift({
        id: 'DEMO-' + Date.now(),
        name,
        amount: price,
        status: '已支付（模拟）'
      });
      db.minutes += name.includes('加量包') ? 60 : 600;
      saveDb();
      closeModal();
      alert(`支付成功！已为您成功增加会议时长权益。`);
      render();
    }

    function openAddTaskModal() {
      $('#modal-slot').innerHTML = `
        <div class="modal-overlay">
          <div class="modal-box">
            <div class="modal-header">
              <h2>创建新待办事项</h2>
              <button class="link" onclick="closeModal()">✕</button>
            </div>
            <label>待办内容</label>
            <input type="text" id="new-task-text" placeholder="例如：完善 macOS 权限引导说明">
            <label>负责人</label>
            <input type="text" id="new-task-owner" value="我">
            <label>截止日期</label>
            <input type="text" id="new-task-due" value="下周一">
            <div class="modal-footer">
              <button onclick="closeModal()">取消</button>
              <button class="primary" onclick="saveNewTask()">保存待办</button>
            </div>
          </div>
        </div>
      `;
    }

    function saveNewTask() {
      const text = $('#new-task-text')?.value.trim();
      const owner = $('#new-task-owner')?.value.trim() || '我';
      const due = $('#new-task-due')?.value.trim() || '待确认';
      if (!text) { alert('请输入待办内容'); return; }
      
      db.tasks.unshift({
        id: Date.now(),
        text,
        owner,
        due,
        done: false
      });
      saveDb();
      closeModal();
      render();
    }

    function toggleTaskDone(id) {
      const t = db.tasks.find(x => x.id === id);
      if (t) {
        t.done = !t.done;
        saveDb();
        render();
      }
    }

    function deleteTask(id) {
      db.tasks = db.tasks.filter(x => x.id !== id);
      saveDb();
      render();
    }

    function executeSearch() {
      searchQuery = $('#search-input-field')?.value.trim() || '';
      render();
    }

    function openImportModal() {
      alert('【文件导入】支持 MP3/WAV/M4A/MP4 常见音频文件，导入后本地先探测时长，再驱动 ASR 转写。');
    }

    function closeModal() {
      $('#modal-slot').innerHTML = '';
    }

    function exportMarkdown() {
      const blob = new Blob([db.notes], { type: 'text/markdown;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = '听序-会议纪要-导出.md';
      a.click();
      alert('已成功导出 Markdown 会议纪要！');
    }

    function resetAllDemo() {
      if (confirm('确认重置演示数据回初始状态吗？')) {
        db = structuredClone(defaultData);
        saveDb();
        alert('演示数据已重置！');
        go('home');
      }
    }

    // 证据跳转高亮微交互
    function jumpToEvidence(sources) {
      rightTab = 'transcript';
      activeEvidence = sources;
      render();
      setTimeout(() => {
        const lastId = sources[sources.length - 1];
        const el = document.getElementById(`transcript-row-${lastId}`);
        if (el) {
          el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      }, 50);
    }

    function adoptProposal(id) {
      const item = liveItems.find(x => x.id === id);
      if (item && item.proposal) {
        item.title = item.proposal.title;
        item.body = item.proposal.body;
        item.sources = item.proposal.sources;
        item.proposal = null;
        item.confirmed = true;
        render();
        alert('已成功采用新版本修订，并保留历史更正审计！');
      }
    }

    function rejectProposal(id) {
      const item = liveItems.find(x => x.id === id);
      if (item) {
        item.proposal = null;
        render();
        alert('已保留原人工版本，忽略后续新更正。');
      }
    }

    function confirmItem(id) {
      const item = liveItems.find(x => x.id === id);
      if (item) {
        item.confirmed = true;
        render();
      }
    }

    function togglePause() {
      isPaused = !isPaused;
      render();
    }

    function addMark(type) {
      alert(`已在当前时间点 ${fmtTime(secondsElapsed)} 成功记录【${type}】时间锚！`);
    }

    function toggleFloatPill() {
      isFloatPillOn = !isFloatPillOn;
      renderFloatPill();
    }

    function renderFloatPill() {
      if (!isFloatPillOn) {
        $('#floating-slot').innerHTML = '';
        return;
      }
      $('#floating-slot').innerHTML = `
        <div class="floating-pill" data-testid="floating-bar-div-container">
          <span class="pulse-dot"></span>
          <span class="time-display">${fmtTime(secondsElapsed)}</span>
          <button class="small" onclick="togglePause()">${isPaused ? '继续' : '暂停'}</button>
          <button class="small" onclick="addMark('重点')">打点</button>
          <button class="primary small" data-testid="floating-bar-btn-expand-workbench" onclick="toggleFloatPill()">展开</button>
        </div>
      `;
    }

    function advanceStep() {
      if (liveStep < sampleTranscripts.length) {
        liveStep++;
        secondsElapsed += 35;
        render();
      } else {
        alert('已推进完成全场 7 段示例对话！');
      }
    }

    function triggerIncremental() {
      alert('已触发增量滑动窗口分析，同步当前最新议题！');
    }

    function sendChat() {
      const val = $('#live-chat-input')?.value;
      if (!val) return;
      alert(`已基于本场稳定原文快照回答问题：“${val}”`);
    }

    function finishMeeting() {
      alert('会议记录已完成！所有音频与逐字稿已原子落盘，正在生成全场智能纪要。');
      go('detail', 1);
    }

    function openScenarios() {
      alert('【异常测试提示】系统已配置健全的断网录音高保真机制与权限指引，在断网时本地录音继续落盘，联网后支持补转。');
    }

    // 主渲染路由器
    function render() {
      renderNav();
      
      const views = {
        record: renderLiveWorkbench,
        home: renderHome,
        tasks: renderTasks,
        search: renderSearch,
        billing: renderBilling,
        settings: renderSettings,
        detail: renderDetail,
        overview: renderAdminOverview,
        users: renderAdminOverview,
        plans: renderAdminOverview,
        orders: renderBilling,
        audit: renderAdminOverview
      };

      const renderFn = views[currentRoute] || renderHome;
      $('#app-content-root').innerHTML = renderFn();
      renderFloatPill();
    }

    // 初始化渲染
    render();

    // 计时器模拟
    setInterval(() => {
      if (isRecording && !isPaused && currentRoute === 'record') {
        secondsElapsed++;
        const el = $('#live-clock-val');
        if (el) el.textContent = fmtTime(secondsElapsed);
        renderFloatPill();
      }
    }, 1000);
  </script>
</body>
</html>
