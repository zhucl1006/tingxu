# ==============================================================================
# 听序（Tingxu）— 本地与云端容器化编排配置
# 包含：PostgreSQL 16 数据库、控制面 Server、自建 AI Gateway
# ==============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: tingxu-postgres
    restart: always
    environment:
      POSTGRES_USER: tingxu_admin
      POSTGRES_PASSWORD: tingxu_secure_password
      POSTGRES_DB: tingxu_db
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tingxu_admin -d tingxu_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: tingxu-control-plane
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://tingxu_admin:tingxu_secure_password@postgres:5432/tingxu_db
      JWT_SECRET: tingxu_jwt_secret_key_development_only
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      ALIYUN_ACCESS_KEY_ID: ${ALIYUN_ACCESS_KEY_ID:-}
      ALIYUN_ACCESS_KEY_SECRET: ${ALIYUN_ACCESS_KEY_SECRET:-}
      ALIYUN_SMS_SIGN_NAME: ${ALIYUN_SMS_SIGN_NAME:-听序}
      ALIYUN_SMS_TEMPLATE_CODE: ${ALIYUN_SMS_TEMPLATE_CODE:-SMS_TINGXU_CODE}
    ports:
      - "${SERVER_PORT:-3200}:3000"
    volumes:
      - ./server/data:/app/data

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: tingxu-ai-gateway
    restart: always
    environment:
      PORT: 3001
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
    ports:
      - "${GATEWAY_PORT:-3201}:3001"
    volumes:
      - ./server/data:/app/data:ro

volumes:
  postgres_data:
